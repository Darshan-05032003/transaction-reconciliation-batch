services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-recon}
      POSTGRES_USER: ${DB_USERNAME:-recon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-recon}
    ports:
      - "5434:5432"
    volumes:
      - recon-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-recon} -d ${DB_NAME:-recon}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  recon-pgdata:
