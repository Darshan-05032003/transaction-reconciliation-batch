spring:
  application:
    name: transaction-reconciliation-batch
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/recon}
    username: ${DB_USERNAME:recon}
    password: ${DB_PASSWORD:recon}
    hikari:
      # Every running matching partition holds two connections (cursor plus chunk transaction),
      # so the pool must be at least 2 * RECON_GRID_SIZE + 2.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      data-source-properties:
        # Lets the PostgreSQL driver turn a JDBC batch of single-row inserts into multi-row
        # inserts; it halved the generator's insert time and cut the ingest load step by about
        # a quarter at 1,000,000 rows on the machine the README's Performance section describes.
        reWriteBatchedInserts: true
        # Session work_mem for every connection: the pairing query sorts and hashes one
        # partition's share of a file, which fits in memory at 64MB but spills to disk at the
        # server default of 4MB (see the Performance section of the README).
        options: -c work_mem=${DB_WORK_MEM:64MB}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  task:
    execution:
      # Keep Boot's application executor even though the matching step defines its own pool.
      mode: force
    scheduling:
      thread-name-prefix: recon-schedule-

server:
  port: ${SERVER_PORT:8083}

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

app:
  recon:
    folders:
      inbox: ${RECON_INBOX_DIR:data/inbox}
      archive: ${RECON_ARCHIVE_DIR:data/archive}
      failed: ${RECON_FAILED_DIR:data/failed}
      error: ${RECON_ERROR_DIR:data/error}
      reports: ${RECON_REPORTS_DIR:data/reports}
    chunk-size: ${RECON_CHUNK_SIZE:500}
    grid-size: ${RECON_GRID_SIZE:4}
    skip-limit: ${RECON_SKIP_LIMIT:100}
    amount-tolerance: ${RECON_AMOUNT_TOLERANCE:0.00}
    date-tolerance-days: ${RECON_DATE_TOLERANCE_DAYS:3}
    poll-cron: ${RECON_POLL_CRON:0 */5 * * * *}
    write-off-approval-threshold: ${RECON_WRITE_OFF_APPROVAL_THRESHOLD:10000.00}
