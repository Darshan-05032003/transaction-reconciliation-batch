logging:
  level:
    com.darshan.recon: DEBUG

management:
  endpoint:
    health:
      show-details: always

app:
  recon:
    folders:
      inbox: ${java.io.tmpdir}/recon-test/inbox
      archive: ${java.io.tmpdir}/recon-test/archive
      failed: ${java.io.tmpdir}/recon-test/failed
      error: ${java.io.tmpdir}/recon-test/error
      reports: ${java.io.tmpdir}/recon-test/reports
    chunk-size: 50
    grid-size: 2
    skip-limit: 50
    poll-cron: "-"
    write-off-approval-threshold: 1000.00
