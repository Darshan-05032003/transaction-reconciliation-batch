name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Maven verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and run tests
        run: ./mvnw -B clean verify

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint shell scripts
        run: |
          if [ ! -d scripts ]; then
            echo "No scripts directory yet, nothing to lint"
            exit 0
          fi
          find scripts -name '*.sh' -print0 | xargs -0 --no-run-if-empty shellcheck --severity=style
