name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Maven verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and run tests
        run: ./mvnw -B clean verify
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint shell scripts
        run: |
          if [ ! -d scripts ]; then
            echo "No scripts directory yet, nothing to lint"
            exit 0
          fi
          find scripts -name '*.sh' -print0 | xargs -0 --no-run-if-empty shellcheck --severity=style

  docker-image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build --tag transaction-reconciliation-batch:ci .
